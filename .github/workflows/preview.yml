name: Post previews

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [queue.json]

permissions:
  contents: write

concurrency:
  group: previews
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pillow numpy
      - name: ffmpeg for video frames (never blocks posting)
        continue-on-error: true
        run: which ffmpeg || pip install imageio-ffmpeg
      - run: |
          git config user.name "3d-poster-bot"
          git config user.email "actions@users.noreply.github.com"
      - run: python preview.py
